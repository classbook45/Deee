name: CustomModels — Operation Beat Saver 1.45.3

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Delete the previous CMake build directory"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - operation/custommodels
    paths:
      - ".github/workflows/build-custommodels.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-custommodels:
    name: Port, inspect, build and validate CustomModels for Beat Saber 1.45.3
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MOD_REPOSITORY: https://github.com/Metalit/CustomModels.git
      MOD_COMMIT: 28c049c2d24e0d9a0172d42db07ec80e72a3d62d
      BEATSABER_PACKAGE_VERSION: "1.45.3_30054"
      ANDROID_NDK_VERSION: "29.0.14206865"
      CORDL_RANGE: "^4503.0.0"
      HOOK_RANGE: "^9.3.0"
      SCOTLAND2_RANGE: "^0.1.7"
      PAPERLOG_RANGE: "^4.8.0"
      METACORE_RANGE: "^2.0.6"
      CUSTOM_TYPES_RANGE: "^0.21.2"
      LAPIZ_RANGE: "^0.2.23"
      CONFIG_UTILS_RANGE: "^3.0.0"
      BSML_RANGE: "^0.6.5"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and Java
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip zip
          cmake --version
          ninja --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK 29
        run: |
          sdkmanager --install "platform-tools" "ndk;${ANDROID_NDK_VERSION}"
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -f "$NDK_PATH/source.properties"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"
          grep "Pkg.Revision" "$NDK_PATH/source.properties"

      - name: Install PowerShell 7 and QPM CLI
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            sudo snap install powershell --classic
          fi
          pwsh --version
          curl -fsSL -o qpm.zip https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64.zip
          unzip -oq qpm.zip -d /tmp/qpm
          QPM_BIN="$(find /tmp/qpm -type f -name qpm -print -quit)"
          test -n "$QPM_BIN"
          sudo install -m 755 "$QPM_BIN" /usr/local/bin/qpm
          qpm --version

      - name: Clone pinned CustomModels source
        run: |
          mkdir -p src reports artifacts
          git clone https://github.com/Metalit/CustomModels.git src/CustomModels
          cd src/CustomModels
          git checkout --detach "$MOD_COMMIT"
          git submodule update --init --recursive
          git rev-parse HEAD | tee ../../reports/source-commit.txt
          test "$(git rev-parse HEAD)" = "$MOD_COMMIT"
          for f in qpm.json qpm.shared.json mod.template.json CMakeLists.txt scripts/build.ps1 scripts/createqmod.ps1; do
            test -s "$f" || { echo "Missing required source file: $f"; exit 1; }
          done

      - name: Port manifest and QMOD metadata to Beat Saber 1.45.3
        working-directory: src/CustomModels
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          target = os.environ["BEATSABER_PACKAGE_VERSION"]
          ndk = "^29.0.0"
          ranges = {
              "beatsaber-hook": os.environ["HOOK_RANGE"],
              "bs-cordl": os.environ["CORDL_RANGE"],
              "scotland2": os.environ["SCOTLAND2_RANGE"],
              "paper2_scotland2": os.environ["PAPERLOG_RANGE"],
              "metacore": os.environ["METACORE_RANGE"],
              "custom-types": os.environ["CUSTOM_TYPES_RANGE"],
              "lapiz": os.environ["LAPIZ_RANGE"],
              "config-utils": os.environ["CONFIG_UTILS_RANGE"],
              "bsml": os.environ["BSML_RANGE"],
          }

          def patch_manifest(path, nested=False):
              data = json.loads(path.read_text())
              cfg = data["config"] if nested else data
              cfg.setdefault("workspace", {})["ndk"] = ndk
              seen = set()
              for dep in cfg.get("dependencies", []):
                  dep_id = dep["id"]
                  if dep_id in ranges:
                      dep["versionRange"] = ranges[dep_id]
                      seen.add(dep_id)
              missing = sorted(set(ranges) - seen)
              if missing:
                  raise SystemExit(f"{path}: expected dependencies missing: {missing}")
              path.write_text(json.dumps(data, indent=2) + "\n")

          patch_manifest(Path("qpm.json"))
          shared_path = Path("qpm.shared.json")
          shared = json.loads(shared_path.read_text())
          cfg = shared["config"]
          cfg.setdefault("workspace", {})["ndk"] = ndk
          seen = set()
          for dep in cfg.get("dependencies", []):
              dep_id = dep["id"]
              if dep_id in ranges:
                  dep["versionRange"] = ranges[dep_id]
                  seen.add(dep_id)
          missing = sorted(set(ranges) - seen)
          if missing:
              raise SystemExit(f"qpm.shared.json: expected dependencies missing: {missing}")
          # Discard the upstream 1.40.8-era resolved lock snapshot. QPM must
          # resolve fresh artifacts for the declared 1.45.3 dependency ranges.
          shared["restoredDependencies"] = []
          shared_path.write_text(json.dumps(shared, indent=2) + "\n")

          template_path = Path("mod.template.json")
          template = json.loads(template_path.read_text())
          if template.get("packageId") != "com.beatgames.beatsaber":
              raise SystemExit("Unexpected Beat Saber package ID")
          template["packageVersion"] = target
          template_path.write_text(json.dumps(template, indent=2) + "\n")

          print("Target package:", target)
          print("NDK range:", ndk)
          for key, value in ranges.items():
              print(f"{key}: {value}")
          print("Cleared stale restoredDependencies lock snapshot.")
          PY

      - name: Resolve target NDK and restore 1.45.3 dependency graph
        working-directory: src/CustomModels
        run: |
          qpm ndk resolve -d
          qpm restore
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("qpm.shared.json").read_text())
          resolved = {x["dependency"]["id"]: x["version"] for x in d.get("restoredDependencies", [])}
          required = {
              "beatsaber-hook": "9.3.0",
              "bs-cordl": "4503.0.0",
              "scotland2": "0.1.7",
              "paper2_scotland2": "4.8.0",
              "metacore": "2.0.6",
              "custom-types": "0.21.2",
              "config-utils": "3.0.0",
              "bsml": "0.6.5",
          }
          def version_tuple(value):
              parts = []
              for part in value.split("."):
                  digits = "".join(ch for ch in part if ch.isdigit())
                  if not digits:
                      break
                  parts.append(int(digits))
              return tuple((parts + [0, 0, 0])[:3])
          errors = []
          for dep, minimum in required.items():
              actual = resolved.get(dep)
              print(f"{dep}: {actual or 'MISSING'} (minimum baseline {minimum})")
              if not actual or version_tuple(actual) < version_tuple(minimum):
                  errors.append(f"{dep}: expected >= {minimum}, got {actual or 'missing'}")
          if errors:
              raise SystemExit("\n".join(errors))
          Path("../../reports/resolved-dependencies.json").write_text(json.dumps(resolved, indent=2) + "\n")
          PY
          test -d extern/includes
          test -d extern/libs
          {
            echo "### Headers"
            find extern/includes -mindepth 1 -maxdepth 2 -type d | sort | head -120
            echo "### Libraries"
            find extern/libs -maxdepth 1 -type f -printf '%f\n' | sort
          } | tee ../../reports/dependencies.txt

      - name: Check source API migration markers
        working-directory: src/CustomModels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path("include/hooks.hpp"), Path("src/hooks.cpp"), Path("src/main.cpp")]
          for p in files:
              if not p.is_file():
                  raise SystemExit(f"Missing source file: {p}")
          hooks = Path("include/hooks.hpp").read_text()
          main = Path("src/main.cpp").read_text()
          checks = {
              "hook implementation includes modern hook header": "beatsaber-hook/shared/utils/hooking.hpp" in hooks,
              "custom-types auto registration call": "custom_types::Register::AutoRegister()" in main,
              "IL2CPP initialization before mod hooks": main.find("il2cpp_functions::Init()") < main.find("Hooks::Install()"),
          }
          for label, ok in checks.items():
              print(f"[{'PASS' if ok else 'FAIL'}] {label}")
          if not all(checks.values()):
              raise SystemExit("Source API preflight failed; refusing to package.")
          PY

      - name: Build native library and create QMOD
        working-directory: src/CustomModels
        env:
          CLEAN_BUILD: ${{ inputs.clean_build }}
        run: |
          if [[ "$CLEAN_BUILD" == "true" ]]; then
            rm -rf build
          fi
          qpm s qmod 2>&1 | tee ../../reports/build-and-package.log
          test -s CustomModels.qmod
          test -s build/libcustommodels.so
          test -s build/debug/libcustommodels.so
          cp CustomModels.qmod ../../artifacts/
          cp build/libcustommodels.so ../../artifacts/
          cp build/debug/libcustommodels.so ../../artifacts/debug_libcustommodels.so

      - name: Validate QMOD metadata, archive and ARM64 ELF
        run: |
          python3 - <<'PY'
          import json, pathlib, struct, zipfile
          expected = "1.45.3_30054"
          qmod = pathlib.Path("artifacts/CustomModels.qmod")
          so = pathlib.Path("artifacts/libcustommodels.so")
          assert qmod.is_file() and qmod.stat().st_size > 0, "QMOD missing or empty"
          assert so.is_file() and so.stat().st_size > 0, "Native library missing or empty"
          data = so.read_bytes()
          assert data[:4] == b"\x7fELF", "Native library is not ELF"
          assert data[4] == 2 and data[5] == 1, "Expected ELF64 little-endian"
          assert struct.unpack("<H", data[18:20])[0] == 183, "Expected AArch64 machine type"
          with zipfile.ZipFile(qmod) as z:
              bad = z.testzip()
              assert bad is None, f"Corrupt QMOD entry: {bad}"
              names = z.namelist()
              metadata = next((n for n in names if n.endswith("mod.json")), None)
              assert metadata, "QMOD does not contain mod.json"
              mod = json.loads(z.read(metadata))
              assert mod.get("packageId") == "com.beatgames.beatsaber", mod
              assert mod.get("packageVersion") == expected, mod.get("packageVersion")
              assert any(n.endswith("libcustommodels.so") for n in names), "QMOD lacks native library"
              print("QMOD packageVersion:", mod["packageVersion"])
              print("QMOD entries:")
              print("\n".join(names))
          print("Validated ARM64 ELF and 1.45.3 QMOD metadata.")
          PY

      - name: Write build summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo "# CustomModels — Beat Saber 1.45.3 build report"
            echo
            echo "- Target package: $BEATSABER_PACKAGE_VERSION"
            echo "- Source commit: $MOD_COMMIT"
            echo "- Hook range: $HOOK_RANGE"
            echo "- CORDL range: $CORDL_RANGE"
            echo "- Android NDK: $ANDROID_NDK_VERSION"
            echo "- This workflow only builds and validates artifacts; it never installs to a headset."
            echo
            echo "A passing compile and archive check do not by themselves prove runtime compatibility."
          } > reports/BUILD-REPORT.md

      - name: Upload QMOD and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CustomModels-BeatSaber-1.45.3-results
          path: |
            artifacts/
            reports/
          if-no-files-found: warn
          retention-days: 14
